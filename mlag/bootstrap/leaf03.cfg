nv set system hostname leaf03
nv set interface lo ip address 10.0.0.3/32
nv set interface lo type loopback
nv set interface swp1-3 type swp
nv set router bgp autonomous-system 65103
nv set router bgp router-id 10.0.0.3
nv set router bgp state enabled
nv set vrf default router bgp state enabled
nv set vrf default router bgp address-family ipv4-unicast state enabled
nv set vrf default router bgp address-family ipv4-unicast redistribute connected state enabled
nv set vrf default router bgp address-family l2vpn-evpn state enabled
nv set vrf default router bgp path-selection multipath aspath-ignore enabled
nv set vrf default router bgp neighbor swp2 remote-as external
nv set vrf default router bgp neighbor swp2 type unnumbered
nv set vrf default router bgp neighbor swp2 address-family l2vpn-evpn state enabled
nv set vrf default router bgp neighbor swp3 remote-as external
nv set vrf default router bgp neighbor swp3 type unnumbered
nv set vrf default router bgp neighbor swp3 address-family l2vpn-evpn state enabled
nv set evpn state enabled
nv set system ssh-server state enabled
nv set nve vxlan state enabled
nv set nve vxlan source address 10.0.0.3
nv set bridge domain br_default vlan 100 vni 10100
nv set interface swp1 bridge domain br_default access 100

name: vs-mlag
mgmt:
  network: vs-mlag
  ipv4-subnet: 172.20.51.0/24
topology:
  defaults:
    kind: nvidia_cumulusvx
    image: vrnetlab/nvidia_cumulus-vx:5.15.0
  nodes:
    spine01:
      startup-config: bootstrap/spine01.cfg
    spine02:
      startup-config: bootstrap/spine02.cfg
    leaf01:
      startup-config: bootstrap/leaf01.cfg
    leaf02:
      startup-config: bootstrap/leaf02.cfg
    leaf03:
      startup-config: bootstrap/leaf03.cfg
    host01:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip link set eth1 down
      - ip link set eth2 down
      - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer3+4
      - ip link set eth1 master bond0
      - ip link set eth2 master bond0
      - ip link set eth1 mtu 9216
      - ip link set eth2 mtu 9216
      - ip link set bond0 mtu 9216
      - ip link set eth1 up
      - ip link set eth2 up
      - ip link set bond0 up
      - ip addr add 172.16.10.11/24 dev bond0
    host02:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip link set eth1 mtu 9216
      - ip addr add 172.16.10.12/24 dev eth1
      - ip addr add 172.16.10.13/24 dev eth1
      - ip addr add 172.16.10.14/24 dev eth1
      - ip addr add 172.16.10.15/24 dev eth1
  links:
  - endpoints:
    - leaf01:swp1
    - host01:eth1
  - endpoints:
    - leaf02:swp1
    - host01:eth2
  - endpoints:
    - leaf03:swp1
    - host02:eth1
  - endpoints:
    - leaf01:swp2
    - spine01:swp1
  - endpoints:
    - leaf01:swp3
    - spine02:swp1
  - endpoints:
    - leaf02:swp2
    - spine01:swp2
  - endpoints:
    - leaf02:swp3
    - spine02:swp2
  - endpoints:
    - leaf03:swp2
    - spine01:swp3
  - endpoints:
    - leaf03:swp3
    - spine02:swp3
  - endpoints:
    - leaf01:swp4
    - leaf02:swp4
  - endpoints:
    - leaf01:swp5
    - leaf02:swp5
